version: '3.8'

services:
  mongodb:
    image: mongo:6
    container_name: computaquest-mongodb
    restart: always
    ports:
      - "27017:27017"
    volumes:
      - mongodb_data:/data/db
    environment:
      MONGO_INITDB_DATABASE: computaquest
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_USERNAME:-admin}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_PASSWORD:-computaquest2024}
    networks:
      - computaquest-network

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: computaquest-backend
    restart: always
    ports:
      - "4000:4000"
    environment:
      MONGODB_URI: mongodb://${MONGO_USERNAME:-admin}:${MONGO_PASSWORD:-computaquest2024}@mongodb:27017/computaquest?authSource=admin
      JWT_SECRET: ${JWT_SECRET:-computaquest-production-secret-2024}
      JWT_EXPIRATION_MS: ${JWT_EXPIRATION_MS:-604800000}
      OPENAI_API_KEY: ${OPENAI_API_KEY}
      FRONTEND_URL: ${FRONTEND_URL:-http://localhost:3000}
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE:-prod}
    depends_on:
      - mongodb
    networks:
      - computaquest-network

  frontend:
    build:
      context: ./frontend-react
      dockerfile: Dockerfile
    container_name: computaquest-frontend
    restart: always
    ports:
      - "3000:3000"
    depends_on:
      - backend
    networks:
      - computaquest-network

networks:
  computaquest-network:
    driver: bridge

volumes:
  mongodb_data:
    driver: local
