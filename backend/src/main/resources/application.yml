server:
  port: ${PORT:4000}

spring:
  data:
    mongodb:
      uri: ${MONGODB_URI:mongodb://localhost:27017/computaquest}
  jackson:
    default-property-inclusion: non_null

app:
  jwt:
    secret: ${JWT_SECRET}
    expiration: ${JWT_EXPIRATION_MS:604800000}
  openai:
    api-key: ${OPENAI_API_KEY:NOT_CONFIGURED}
    model: gpt-3.5-turbo
    max-tokens: 300
    temperature: 0.7
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:3000}
  frontend-url: ${FRONTEND_URL:http://localhost:3000}
  mail:
    from: ${MAIL_FROM:noreply@computaquest.app}

logging:
  level:
    root: INFO
    com.computaquest: INFO

